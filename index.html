<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages SPA fallback: restore the real path that 404.html
      // encoded into the query string, before Vue Router boots.
      // https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch.png" />
    <link rel="preload" as="image" href="/images/DTS.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DTS | خدمات التحول الرقمى</title>
    <meta
      name="description"
      content="منظومة DTS المتكاملة لإصدار الفواتير والإيصالات الإلكترونية والتوقيع الرقمي، مرتبطة مباشرة بمصلحة الضرائب المصرية."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
